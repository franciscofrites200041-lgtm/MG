# Stack MG Bot en VPS.
#
# Servicios:
#   qdrant     - vector DB (unica fuente de verdad)
#   gateway    - RAG gateway (Qdrant + Gemini) expone endpoint OpenAI-compat
#   openwebui  - UI ChatGPT-clone con auth + persistencia de chats
#   nginx      - reverse proxy: openwebui en /, gateway/qdrant no expuestos
#   certbot    - TLS (comentado hasta primer certonly con dominio)
#
# Bot Telegram y frontend viejo quedan en git history si hicieran falta.

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: mg-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
    # ponytail: sin healthcheck, la imagen no trae curl. depends_on simple alcanza.

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: mg-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      - qdrant
    volumes:
      - hf_cache:/root/.cache/huggingface
      - /data:/data  # para bg_worker: lee /data/nas_mirror
    environment:
      RAG_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    # No exponer al host: solo openwebui accede via red interna docker

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mg-openwebui
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      # Branding
      WEBUI_NAME: "Estudio Montoya-Gherzi"
      # Apuntar al gateway como si fuera OpenAI
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: dummy-not-used-but-required
      # Sign-up abierto pero con aprobacion: primer user = admin, resto queda pending
      # hasta que un admin lo apruebe manualmente desde Panel > Users.
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "pending"
      # WebUI publica
      WEBUI_URL: http://localhost:3000
      # Desactivar features no necesarias
      ENABLE_OLLAMA_API: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_WEB_SEARCH: "false"
    ports:
      - "127.0.0.1:3000:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: mg-nginx
    restart: unless-stopped
    depends_on:
      - openwebui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  # Descomentar despues del primer certbot certonly manual:
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: mg-certbot
  #   restart: unless-stopped
  #   volumes:
  #     - certbot_certs:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  qdrant_data:
  qdrant_snapshots:
  hf_cache:
  openwebui_data:
  certbot_certs:
  certbot_www:
