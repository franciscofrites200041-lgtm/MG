# Stack completa MG Bot en VPS.
#
# Servicios:
#   qdrant  - vector DB, unica fuente de verdad post-migracion
#   bot     - bot Telegram (usa Qdrant como RAG backend)
#   api     - FastAPI para el frontend (mismo Dockerfile que el bot)
#   nginx   - reverse proxy + serve del frontend estatico + TLS
#   certbot - renovacion de certs Lets Encrypt (comentado hasta primer certonly)
#
# Bind mount: /data del host se expone como /data en los containers.
# rclone del host escribe a /data/nas_mirror -> visible en bot/api.

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: mg-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    container_name: mg-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - /data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      RAG_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mg-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - /data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      RAG_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: mg-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  # Descomentar despues del primer certbot certonly manual:
  # certbot:
  #   image: certbot/certbot:latest
  #   container_name: mg-certbot
  #   restart: unless-stopped
  #   volumes:
  #     - certbot_certs:/etc/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  qdrant_data:
  qdrant_snapshots:
  hf_cache:
  certbot_certs:
  certbot_www:
