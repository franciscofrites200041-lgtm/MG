<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador Montoya-Gherzi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <header class="mb-8">
      <h1 class="text-3xl font-semibold tracking-tight">Buscador Interno</h1>
      <p class="text-slate-600 mt-1">Montoya-Gherzi &middot; Documentos indexados</p>
    </header>

    <form id="search-form" class="flex gap-2 mb-6">
      <input
        id="q"
        type="text"
        placeholder="Consulta en lenguaje natural o palabras clave"
        class="flex-1 border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-800"
        autofocus
      />
      <select id="top_k" class="border border-slate-300 rounded-lg px-3 py-3">
        <option value="5">Top 5</option>
        <option value="10" selected>Top 10</option>
        <option value="20">Top 20</option>
      </select>
      <button
        type="submit"
        class="bg-slate-900 text-white rounded-lg px-6 py-3 hover:bg-slate-700 disabled:opacity-40"
      >
        Buscar
      </button>
    </form>

    <div id="status" class="text-sm text-slate-500 mb-4"></div>

    <div id="results" class="space-y-3"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
