# Nginx: proxy a Open WebUI con TLS Let's Encrypt.
# HTTP 80 -> redirect a HTTPS (excepto ACME challenge)
# HTTPS 443 -> proxy Open WebUI

upstream openwebui {
  server openwebui:8080;
}

# --- Common proxy config ---
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name bot-estudio.montoya-gherzi.com.ar;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name bot-estudio.montoya-gherzi.com.ar;

  ssl_certificate     /etc/letsencrypt/live/bot-estudio.montoya-gherzi.com.ar/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot-estudio.montoya-gherzi.com.ar/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 50M;

  # ponytail: quitar la marca "Open WebUI" que Open WebUI concatena.
  sub_filter '(Open WebUI)' '';
  sub_filter ' Open WebUI' '';
  sub_filter 'Open WebUI' 'Estudio Montoya-Gherzi';
  sub_filter_once off;
  sub_filter_types text/html text/css text/javascript application/javascript application/json;

  location / {
    proxy_pass http://openwebui;
    proxy_http_version 1.1;

    # Websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # sub_filter necesita el upstream sin gzip/br (sino los bytes vienen comprimidos)
    proxy_set_header Accept-Encoding "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
