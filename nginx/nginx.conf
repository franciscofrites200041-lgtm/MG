# Nginx: sirve el frontend estatico y hace reverse proxy al API.
#
# TLS: certbot (companion certbot container) escribe certs en /etc/letsencrypt.
# En primer deploy, arrancar con solo HTTP y correr `docker compose exec certbot certbot ...`,
# despues descomentar el bloque TLS.

upstream api_backend {
  server api:8000;
}

server {
  listen 80;
  server_name _;

  # Ruta ACME challenge para certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Frontend estatico
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
  }

  location = /app.js {
    try_files /app.js =404;
  }

  location = /style.css {
    try_files /style.css =404;
  }

  # API bajo /api/*
  location /api/ {
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Health check
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}

