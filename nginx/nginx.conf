# Nginx: proxy directo a Open WebUI. TLS agregado despues (cuando haya dominio).

upstream openwebui {
  server openwebui:8080;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  # ACME challenge para certbot (usar despues cuando tengas dominio)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://openwebui;
    proxy_http_version 1.1;

    # Websocket support (Open WebUI usa ws para streaming interno)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming SSE: no bufferizar
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}

